name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: commit dist
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/index.js
          git diff --staged --quiet || git commit -m "build: dist/index.js"
          git push
