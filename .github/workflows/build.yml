name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: stage manifest for dist
        run: |
          node -e "const m=require('./manifest.json'); m.main='index.js'; require('fs').writeFileSync('dist/manifest.json', JSON.stringify(m,null,4))"
      - name: commit dist
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/index.js dist/manifest.json
          git diff --staged --quiet || git commit -m "build: dist"
          git push
